<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wortschatz Österreich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: slim sticky top bar (name + two tabs), one centred column; flashcard first, controls under it; exam is a step-by-step card with its own Check button. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --fg:#171B26; --muted:#586175; --line:#DADFE9;
  --ink:#1B2437; --ink-fg:#FFFFFF; --soft:#E9ECF4;
  --red:#C8102E; --stripe-mid:#FFFFFF;
  --der:#2358C9; --die:#C42B40; --das:#1B8447;
  --ok:#1B7A44; --ok-bg:#E2F3E9; --bad:#B3261E; --bad-bg:#FCE7E4;
  --focus:#2358C9;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141B; --surface:#1A1F2A; --fg:#ECEFF6; --muted:#9BA4B8; --line:#2B3243;
    --ink:#E8ECF5; --ink-fg:#11141B; --soft:#242B3A;
    --red:#E0334F; --stripe-mid:#ECEFF6;
    --der:#7AA2FF; --die:#FF8193; --das:#52CF86;
    --ok:#5CD08A; --ok-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1916;
    --focus:#7AA2FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1F2A; --fg:#ECEFF6; --muted:#9BA4B8; --line:#2B3243;
  --ink:#E8ECF5; --ink-fg:#11141B; --soft:#242B3A;
  --red:#E0334F; --stripe-mid:#ECEFF6;
  --der:#7AA2FF; --die:#FF8193; --das:#52CF86;
  --ok:#5CD08A; --ok-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1916;
  --focus:#7AA2FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.stripe{height:5px;margin-inline:-16px;background:linear-gradient(var(--red) 0 33.3%,var(--stripe-mid) 33.3% 66.6%,var(--red) 66.6%)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
main{max-width:760px;margin:0 auto;padding-top:18px}
.panel[hidden]{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;min-width:0}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;max-width:100%;color:var(--fg)}
select{padding-right:8px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.chk{display:flex;align-items:center;gap:7px;font-size:.9rem;color:var(--fg)}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.voice{font-size:.8rem;color:var(--muted);margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.warn{border-color:var(--die);color:var(--die)}

/* flashcard */
.stage{perspective:1400px}
.card{display:block;width:100%;border:0;background:none;padding:0;text-align:center;position:relative;min-height:330px}
.card-in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:34px 18px 26px;box-shadow:0 8px 24px -14px rgba(20,30,60,.35);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.tag{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tag span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{font-size:5.4rem;line-height:1.1;min-height:6rem;display:flex;align-items:center}
.pic.big{font-size:8.5rem;min-height:9.5rem;justify-content:center}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.word.en{font-weight:600}
.sub{color:var(--muted);font-size:1rem;overflow-wrap:anywhere}
.hint{position:absolute;bottom:10px;left:0;right:0;font-size:.74rem;color:var(--muted)}
.at{display:inline-block;background:var(--red);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;vertical-align:middle;font-family:var(--f-body)}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.nav .wide{grid-column:1/-1}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.meter{margin-top:16px}
.meter-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;gap:10px;flex-wrap:wrap}
.track{height:7px;background:var(--soft);border-radius:99px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center}
.empty h2{margin:0 0 6px;font-family:var(--f-display)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:.85rem}

/* exam */
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.box h2{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.box p.lead{margin:0 0 16px;color:var(--muted)}
.types{display:grid;gap:8px;margin:6px 0 18px}
.types .chk{background:var(--soft);border-radius:12px;padding:10px 12px;align-items:flex-start}
.types .chk small{display:block;color:var(--muted);font-size:.8rem}
.setup-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.qtype{background:var(--soft);padding:3px 10px;border-radius:99px;font-weight:600;color:var(--fg)}
.prompt{text-align:left;margin:6px 0 16px}
.prompt .pic{font-size:3.4rem;min-height:0;margin-bottom:4px}
.prompt .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.15;overflow-wrap:anywhere}
.prompt .ask{color:var(--muted);font-size:.92rem;margin-bottom:4px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:600;font-size:1.02rem;min-width:0;overflow-wrap:anywhere;display:flex;gap:10px;align-items:baseline}
.opt kbd{font-family:var(--f-body);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
.opt:hover{border-color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opts.art{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.art .opt{justify-content:center;font-size:1.3rem;font-family:var(--f-display);font-weight:800}
.answer{width:100%;font-size:1.2rem;padding:13px 14px;border-width:2px}
.answer.right{border-color:var(--ok);background:var(--ok-bg)}
.answer.wrong{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;text-align:left}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{margin:0 0 4px;font-size:1.05rem}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.fb p{margin:2px 0;overflow-wrap:anywhere}
.fb .corr{font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;margin:6px 0}
.miss{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.miss li{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.miss small{color:var(--muted)}
.foot{margin-top:28px;font-size:.78rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .opts.art{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pic{font-size:4.4rem}
  .pic.big{font-size:7rem;min-height:8rem}
  .box{padding:18px 14px}
}
@media (prefers-reduced-motion:reduce){
  .card-in,.fill{transition:none}
}
</style>

<div class="stripe" aria-hidden="true"></div>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Wortschatz Österreich</h1>
      <p id="stats">1000 words · A1–A2 · ÖIF</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Mode">
      <button role="tab" id="tab-cards" aria-selected="true" aria-controls="panel-cards">Flashcards</button>
      <button role="tab" id="tab-exam" aria-selected="false" aria-controls="panel-exam">Exam</button>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="panel-cards" role="tabpanel" aria-labelledby="tab-cards">
    <div class="bar">
      <label class="fld">Theme<select id="theme"></select></label>
      <div class="fld">Front side
        <div class="seg" role="group" aria-label="Front side">
          <button type="button" id="side-pic" aria-pressed="true">Picture</button>
          <button type="button" id="side-de" aria-pressed="false">Deutsch</button>
          <button type="button" id="side-en" aria-pressed="false">English</button>
        </div>
      </div>
    </div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="opt-shuffle">Shuffle</label>
      <label class="chk"><input type="checkbox" id="opt-hide">Hide known words</label>
      <label class="chk"><input type="checkbox" id="opt-auto">Read aloud automatically</label>
    </div>
    <p class="voice" id="voice" aria-live="polite"></p>
    <div id="cardzone"></div>
  </section>

  <section class="panel" id="panel-exam" role="tabpanel" aria-labelledby="tab-exam" hidden>
    <div id="examzone"></div>
  </section>

  <p class="foot">Pictures are emoji. Sound uses the text-to-speech voices installed on your device. This 1,000-word list was compiled for everyday A1–A2 topics and ÖIF course topics. It is not the official ÖIF or ÖSD word list.</p>
</main>

const ART_RE = /^(der|die|das) (.+)$/;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){
  return String(s).toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/[.,!?;:'"“”„…]/g,'').replace(/\s+/g,' ').trim();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const WORDS = RAW.map(function(r,i){
  const m = ART_RE.exec(r[0]);
  const en = r[1].replace(' (Austrian)','');
  return {n:i+1,de:r[0],en:r[1],enc:en,em:r[2],t:r[3],at:r[1].indexOf('(Austrian)')>-1,art:m?m[1]:null,noun:m?m[2]:null,nde:norm(r[0])};
});
const BY_EN = new Map(), BY_DE = new Map();
WORDS.forEach(function(w){
  if(!BY_EN.has(w.enc)) BY_EN.set(w.enc,[]); BY_EN.get(w.enc).push(w);
  if(!BY_DE.has(w.nde)) BY_DE.set(w.nde,[]); BY_DE.get(w.nde).push(w);
});
const QTYPES = {
  choose:{label:'Choose the word'},
  meaning:{label:'Choose the meaning'},
  write:{label:'Write the word'},
  listen:{label:'Listen and write'},
  article:{label:'Article'}
};
function eligible(type, pool){
  if(type==='article') return pool.filter(function(w){return !!w.art;});
  return pool;
}
function distractors(w, pool, n, key){
  const cls = !!w.art; const seen = new Set([key(w)]); const seenEn = new Set([w.enc]); const out = [];
  function take(list){
    for(const x of list){
      if(out.length>=n) break;
      if(x===w || x.enc===w.enc) continue;
      const k = key(x); if(seen.has(k) || seenEn.has(x.enc)) continue;
      seen.add(k); seenEn.add(x.enc); out.push(x);
    }
  }
  take(shuffle(pool.filter(function(x){return !!x.art===cls;})));
  if(out.length<n) take(shuffle(WORDS.filter(function(x){return !!x.art===cls;})));
  if(out.length<n) take(shuffle(WORDS));
  return out;
}
function makeQuestion(type, w, pool){
  const q = {type:type, w:w};
  if(type==='choose'){
    q.options = shuffle([w].concat(distractors(w,pool,3,function(x){return x.de;})));
    q.correct = q.options.indexOf(w);
  } else if(type==='meaning'){
    const opts = [w].concat(distractors(w,pool,3,function(x){return x.enc;})).map(function(x){return x.enc;});
    q.options = shuffle(opts); q.correct = q.options.indexOf(w.enc);
  } else if(type==='article'){
    q.options = ['der','die','das']; q.correct = q.options.indexOf(w.art);
  } else if(type==='write'){
    q.accepted = BY_EN.get(w.enc);
  } else if(type==='listen'){
    q.accepted = BY_DE.get(w.nde);
  }
  return q;
}
function buildQuiz(themeIdx, count, types){
  const pool = WORDS.filter(function(w){return themeIdx<0 || w.t===themeIdx;});
  const usable = types.filter(function(t){return eligible(t,pool).length>0;});
  if(!usable.length) return [];
  const bag = {};
  usable.forEach(function(t){bag[t]=shuffle(eligible(t,pool));});
  const cap = Math.min(count, pool.length);
  const qs = []; let order = []; let guard = 0;
  while(qs.length<cap && guard++<10000){
    if(!order.length) order = shuffle(usable);
    const t = order.pop();
    if(!bag[t].length) bag[t] = shuffle(eligible(t,pool));
    qs.push(makeQuestion(t,bag[t].pop(),pool));
  }
  return qs;
}
function checkWrite(input, accepted){
  const x = norm(input);
  if(!x) return {ok:false,note:'Type an answer first.'};
  for(const a of accepted){ if(norm(a.de)===x) return {ok:true,note:''}; }
  for(const a of accepted){
    if(a.noun){
      if(norm(a.noun)===x) return {ok:false,note:'Add the article (der, die or das).'};
      const parts = x.split(' ');
      if(parts.length>1 && ['der','die','das'].indexOf(parts[0])>-1 && parts.slice(1).join(' ')===norm(a.noun)) return {ok:false,note:'Right word, wrong article.'};
    }
  }
  return {ok:false,note:''};
}

/* ---------- speech ---------- */
const hasSpeech = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let voice = null;
function pickVoice(){
  if(!hasSpeech) return null;
  const vs = speechSynthesis.getVoices();
  const prefs = ['de-AT','de-DE','de-CH'];
  for(const p of prefs){ const v = vs.find(function(v){return v.lang.replace('_','-')===p;}); if(v) return v; }
  return vs.find(function(v){return v.lang.toLowerCase().indexOf('de')===0;}) || null;
}
function updateVoice(){
  voice = pickVoice();
  const el = document.getElementById('voice');
  if(!hasSpeech) el.textContent = 'This browser cannot play speech, so sound is not available here.';
  else if(!voice) el.textContent = 'No German voice found on this device. Install a German voice in your system settings for correct pronunciation.';
  else el.textContent = 'Voice: ' + voice.name + ' (' + voice.lang.replace('_','-') + ')' + (voice.lang.replace('_','-')==='de-AT' ? '' : '. No Austrian voice installed, so a standard German voice is used.');
}
function speak(text, slow){
  if(!hasSpeech) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'de-AT';
    if(voice) u.voice = voice;
    u.rate = slow ? 0.55 : 0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
if(hasSpeech){ updateVoice(); speechSynthesis.addEventListener('voiceschanged', updateVoice); } else { updateVoice(); }

const cs = {deck:[], i:0, flipped:false, side:'pic'};
fillThemes();
const optShuffle = document.getElementById('opt-shuffle'), optHide = document.getElementById('opt-hide'), optAuto = document.getElementById('opt-auto');
const cardzone = document.getElementById('cardzone');

function buildDeck(){
  const ti = parseInt(themeSel.value,10);
  let d = WORDS.filter(function(w){return (ti<0 || w.t===ti) && (cs.side!=='pic' || w.em);});
  if(optHide.checked) d = d.filter(function(w){return !known.has(w.n);});
  if(optShuffle.checked) d = shuffle(d);
  cs.deck = d; cs.i = 0; cs.flipped = false;
  renderCard();
  maybeAuto();
}
function face(w, side, main){
  const pic = w.em ? '<div class="pic" aria-hidden="true">'+w.em+'</div>' : '';
  const tag = '<div class="tag"><span>'+esc(THEMES[w.t][0])+'</span><span>#'+w.n+'</span></div>';
  if(side==='pic') return tag + '<div class="pic big" role="img" aria-label="Picture card">'+w.em+'</div>';
  if(side==='de'){
    return tag + pic + '<div class="word">'+deHtml(w)+(w.at?' <span class="at">AT</span>':'')+'</div>' + (main?'':'<div class="sub">'+esc(w.enc)+'</div>');
  }
  return tag + pic + '<div class="word en">'+esc(w.enc)+'</div>' + (main?'':'<div class="sub">'+deHtml(w)+(w.at?' <span class="at">AT</span>':'')+'</div>');
}
function renderCard(){
  const d = cs.deck;
  if(!d.length){
    const hidden = optHide.checked;
    cardzone.innerHTML = '<div class="empty"><h2>' + (hidden ? 'All words in this theme are marked as known' : (cs.side==='pic' ? 'No pictures in this theme' : 'No words here')) + '</h2><p class="sub">' + (hidden ? 'Switch off "Hide known words" or reset your progress to practise them again.' : (cs.side==='pic' ? 'Choose the Deutsch or English front side to practise words without pictures, or pick another theme.' : 'Pick another theme.')) + '</p>' + (known.size ? '<button class="btn" type="button" data-act="reset">Reset known words</button>' : '') + '</div>';
    return;
  }
  if(cs.i>=d.length) cs.i = d.length-1;
  const w = d[cs.i];
  const other = cs.side==='en' ? 'de' : (cs.side==='pic' ? 'de' : 'en');
  const total = d.length;
  const kn = d.filter(function(x){return known.has(x.n);}).length;
  cardzone.innerHTML =
    '<div class="stage"><button type="button" class="card'+(cs.flipped?' flipped':'')+'" data-act="flip" aria-label="Flashcard. Press to flip." id="thecard">' +
      '<div class="card-in"><div class="face front">'+face(w,cs.side,true)+'<div class="hint">Tap to flip</div></div>' +
      '<div class="face back">'+face(w,other,false)+'<div class="hint">Tap to flip back</div></div></div></button></div>' +
    '<div class="row3">' +
      '<button class="btn" type="button" data-act="sound" aria-label="Hear the word">'+ICON_SOUND+'Hear</button>' +
      '<button class="btn" type="button" data-act="slow" aria-label="Hear the word slowly">'+ICON_SLOW+'Slowly</button>' +
      '<button class="btn" type="button" data-act="flip">Flip</button></div>' +
    '<div class="nav">' +
      '<button class="btn warn" type="button" data-act="again">Practise again</button>' +
      '<button class="btn good" type="button" data-act="known">'+(known.has(w.n)?'Known (marked)':'I know it')+'</button>' +
      '<button class="btn" type="button" data-act="prev">Previous</button>' +
      '<button class="btn primary" type="button" data-act="next">Next</button></div>' +
    '<div class="meter"><div class="meter-top"><span>Card '+(cs.i+1)+' of '+total+'</span><span>Known in this set: '+kn+' · Total known: '+known.size+'</span></div>' +
    '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+(cs.i+1)+'"><div class="fill" style="width:'+Math.round((cs.i+1)/total*100)+'%"></div></div></div>' +
    (known.size ? '<button class="link" type="button" data-act="reset">Reset known words</button>' : '');
}
function currentWord(){return cs.deck[cs.i];}
function maybeAuto(){
  if(optAuto.checked && cs.side==='de' && !cs.flipped && currentWord()) speak(currentWord().de,false);
}
function go(delta){
  if(!cs.deck.length) return;
  cs.i = (cs.i + delta + cs.deck.length) % cs.deck.length; cs.flipped = false;
  renderCard(); maybeAuto();
}
cardzone.addEventListener('click', function(e){
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.getAttribute('data-act'); const w = currentWord();
  if(act==='flip'){ cs.flipped = !cs.flipped; const c = document.getElementById('thecard'); if(c) c.classList.toggle('flipped', cs.flipped); if(cs.flipped && cs.side!=='de' && optAuto.checked && w) speak(w.de,false); }
  else if(act==='sound' && w) speak(w.de,false);
  else if(act==='slow' && w) speak(w.de,true);
  else if(act==='next') go(1);
  else if(act==='prev') go(-1);
  else if(act==='known' && w){
    known.add(w.n); saveKnown();
    if(optHide.checked){ cs.deck.splice(cs.i,1); cs.flipped=false; if(cs.i>=cs.deck.length) cs.i=0; renderCard(); maybeAuto(); }
    else go(1);
  }
  else if(act==='again' && w){
    known.delete(w.n); saveKnown();
    if(cs.deck.length>1){ cs.deck.splice(cs.i,1); cs.deck.push(w); if(cs.i>=cs.deck.length) cs.i=0; cs.flipped=false; renderCard(); maybeAuto(); }
    else { renderCard(); }
  }
  else if(act==='reset'){ known = new Set(); saveKnown(); buildDeck(); }
});
themeSel.addEventListener('change', buildDeck);
optShuffle.addEventListener('change', buildDeck);
optHide.addEventListener('change', buildDeck);
['pic','de','en'].forEach(function(k){
  document.getElementById('side-'+k).addEventListener('click', function(){setSide(k);});
});
function setSide(s){
  cs.side = s;
  ['pic','de','en'].forEach(function(k){document.getElementById('side-'+k).setAttribute('aria-pressed', k===s);});
  fillThemes(); buildDeck();
}

/* ---------- exam ---------- */
const ex = {phase:'setup', qs:[], i:0, score:0, checked:false, sel:null, res:[], cfg:null};
const examzone = document.getElementById('examzone');
const SETUP = {theme:'-1', count:'20', types:{choose:true,meaning:true,write:true,listen:false,article:true}};

function renderSetup(note){
  const themeOpts = '<option value="-1">All themes</option>' + THEMES.map(function(t,i){return '<option value="'+i+'"'+(SETUP.theme===String(i)?' selected':'')+'>'+esc(t[0])+'</option>';}).join('');
  const cnt = ['10','20','30','50'].map(function(c){return '<option value="'+c+'"'+(SETUP.count===c?' selected':'')+'>'+c+' questions</option>';}).join('');
  const desc = {
    choose:'See the English meaning, pick the German word.',
    meaning:'See the German word, pick the English meaning.',
    write:'See the English meaning, type the German word. Include der, die or das for nouns.',
    listen:'Hear the word, type it. Needs a German voice on your device.',
    article:'See a noun, pick der, die or das.'
  };
  const types = Object.keys(QTYPES).map(function(k){
    return '<label class="chk"><input type="checkbox" data-type="'+k+'"'+(SETUP.types[k]?' checked':'')+'><span>'+QTYPES[k].label+'<small>'+desc[k]+'</small></span></label>';
  }).join('');
  examzone.innerHTML = '<div class="box"><h2>Exam</h2><p class="lead">Every question has its own Check button, so you see the answer straight away.</p>' +
    '<div class="setup-row"><label class="fld">Theme<select id="xtheme">'+themeOpts+'</select></label>' +
    '<label class="fld">Length<select id="xcount">'+cnt+'</select></label></div>' +
    '<div class="types" id="xtypes">'+types+'</div>' +
    (note ? '<p class="fb no" role="alert">'+esc(note)+'</p>' : '') +
    '<button class="btn primary" type="button" data-x="start">Start exam</button></div>';
}
function typeLabel(q){return QTYPES[q.type].label;}
function promptHtml(q){
  const w = q.w;
  const pic = w.em ? '<div class="pic" aria-hidden="true">'+w.em+'</div>' : '';
  if(q.type==='choose' || q.type==='write'){
    return '<div class="prompt">'+pic+'<div class="ask">'+(q.type==='choose'?'Which German word means':'Write the German word for')+'</div><div class="big">'+esc(w.enc)+(w.at?' <span class="at">AT</span>':'')+'</div></div>';
  }
  if(q.type==='meaning'){
    return '<div class="prompt">'+pic+'<div class="ask">What does this mean?</div><div class="big">'+deHtml(w)+(w.at?' <span class="at">AT</span>':'')+'</div><div style="margin-top:10px"><button class="btn" type="button" data-x="sound">'+ICON_SOUND+'Hear</button></div></div>';
  }
  if(q.type==='article'){
    return '<div class="prompt">'+pic+'<div class="ask">Choose the article for</div><div class="big">'+esc(w.noun)+(w.at?' <span class="at">AT</span>':'')+'</div><div class="sub" style="margin-top:2px">'+esc(w.enc)+'</div></div>';
  }
  return '<div class="prompt"><div class="ask">Listen and write what you hear</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px"><button class="btn" type="button" data-x="sound">'+ICON_SOUND+'Play</button><button class="btn" type="button" data-x="slow">'+ICON_SLOW+'Slowly</button></div></div>';
}
function renderQuestion(){
  const q = ex.qs[ex.i]; const total = ex.qs.length;
  let body = '';
  if(q.type==='choose'){
    body = '<div class="opts" role="radiogroup" aria-label="Answers">' + q.options.map(function(o,k){
      return '<button type="button" class="opt" role="radio" aria-checked="false" data-opt="'+k+'"><kbd>'+(k+1)+'</kbd><span>'+deHtml(o)+(o.at?' <span class="at">AT</span>':'')+'</span></button>';
    }).join('') + '</div>';
  } else if(q.type==='meaning'){
    body = '<div class="opts" role="radiogroup" aria-label="Answers">' + q.options.map(function(o,k){
      return '<button type="button" class="opt" role="radio" aria-checked="false" data-opt="'+k+'"><kbd>'+(k+1)+'</kbd><span>'+esc(o)+'</span></button>';
    }).join('') + '</div>';
  } else if(q.type==='article'){
    body = '<div class="opts art" role="radiogroup" aria-label="Articles">' + q.options.map(function(o,k){
      return '<button type="button" class="opt" role="radio" aria-checked="false" data-opt="'+k+'"><span class="'+o+'">'+o+'</span></button>';
    }).join('') + '</div>';
  } else {
    body = '<label class="sr" for="answer">Your answer</label><input type="text" id="answer" class="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Type the German word">';
  }
  examzone.innerHTML = '<div class="box"><div class="qhead"><span class="qtype">'+typeLabel(q)+'</span><span>Question '+(ex.i+1)+' of '+total+' · Correct so far: '+ex.score+'</span></div>' +
    '<div class="track" style="margin:-2px 0 14px"><div class="fill" style="width:'+Math.round(ex.i/total*100)+'%"></div></div>' +
    promptHtml(q) + body + '<div id="fb" aria-live="polite"></div>' +
    '<div class="actions"><button class="btn primary" type="button" id="checkbtn" data-x="check" disabled>Check</button></div></div>';
  ex.checked = false; ex.sel = null;
  const inp = document.getElementById('answer');
  if(inp){
    inp.addEventListener('input', function(){document.getElementById('checkbtn').disabled = !inp.value.trim();});
    if(q.type==='listen') speak(q.w.de,false);
    inp.focus({preventScroll:true});
  }
}
function correctAnswerHtml(q){
  if(q.type==='meaning') return esc(q.w.enc.replace(' (Austrian)',''));
  if(q.type==='article') return '<span class="'+q.w.art+'">'+q.w.art+'</span> '+esc(q.w.noun);
  return deHtml(q.w);
}
function doCheck(){
  const q = ex.qs[ex.i]; if(ex.checked) return;
  let ok = false, note = '', given = '';
  if(q.options){
    if(ex.sel===null) return;
    ok = ex.sel===q.correct;
    given = (q.type==='choose') ? q.options[ex.sel].de : q.options[ex.sel];
    const btns = examzone.querySelectorAll('.opt');
    btns.forEach(function(b,k){
      b.disabled = true;
      if(k===q.correct) b.classList.add('right');
      else if(k===ex.sel) b.classList.add('wrong');
    });
  } else {
    const inp = document.getElementById('answer'); given = inp.value.trim();
    const r = checkWrite(given, q.accepted); ok = r.ok; note = r.note;
    inp.readOnly = true; inp.classList.add(ok?'right':'wrong');
  }
  ex.checked = true; if(ok) ex.score++;
  ex.res.push({q:q, ok:ok, given:given});
  const w = q.w;
  let html = '<div class="fb '+(ok?'ok':'no')+'"><h3>'+(ok?'Correct':'Not quite')+'</h3>';
  if(!ok) html += '<p>Right answer: <span class="corr">'+correctAnswerHtml(q)+'</span></p>';
  else if(q.type==='write'||q.type==='listen') html += '<p><span class="corr">'+deHtml(w)+'</span></p>';
  if(note) html += '<p>'+esc(note)+'</p>';
  html += '<p class="sub">'+deHtml(w)+' = '+esc(w.enc.replace(' (Austrian)',''))+'</p>';
  if(q.accepted && q.accepted.length>1){
    const alt = q.accepted.filter(function(a){return a!==w;}).map(function(a){return a.de;});
    if(alt.length) html += '<p class="sub">Also accepted: '+esc(alt.join(', '))+'</p>';
  }
  html += '<p style="margin-top:8px"><button class="btn" type="button" data-x="sound">'+ICON_SOUND+'Hear it</button></p></div>';
  document.getElementById('fb').innerHTML = html;
  const cb = document.getElementById('checkbtn');
  cb.disabled = false; cb.setAttribute('data-x','next'); cb.textContent = (ex.i+1>=ex.qs.length) ? 'See results' : 'Next question';
  cb.focus({preventScroll:true});
}
function nextQ(){
  ex.i++;
  if(ex.i>=ex.qs.length) renderResults(); else renderQuestion();
}
function renderResults(){
  ex.phase = 'done';
  const total = ex.qs.length; const pct = total ? Math.round(ex.score/total*100) : 0;
  const missed = ex.res.filter(function(r){return !r.ok;});
  const list = missed.map(function(r){
    const q = r.q; const w = q.w;
    let p = '';
    if(q.type==='choose'||q.type==='write') p = esc(w.enc);
    else if(q.type==='meaning') p = deHtml(w);
    else if(q.type==='article') p = esc(w.noun);
    else p = 'Listening';
    return '<li><small>'+typeLabel(q)+' · '+p+'</small><span>Your answer: '+(r.given?esc(r.given):'(empty)')+'</span><span>Correct: <strong>'+correctAnswerHtml(q)+'</strong></span></li>';
  }).join('');
  examzone.innerHTML = '<div class="box"><h2>Result</h2><div class="score">'+ex.score+' / '+total+'</div><p class="lead">'+pct+'% correct. ' +
    (pct>=80 ? 'Strong result.' : pct>=50 ? 'Good start. Review the mistakes below.' : 'Go through the flashcards for this theme, then try again.') + '</p>' +
    (missed.length ? '<h3 style="margin:8px 0 0;font-size:1rem">Mistakes ('+missed.length+')</h3><ul class="miss">'+list+'</ul>' : '<p>No mistakes.</p>') +
    '<div class="actions">' + (missed.length ? '<button class="btn primary" type="button" data-x="retry">Repeat mistakes</button>' : '') +
    '<button class="btn" type="button" data-x="again">New exam</button></div></div>';
}
function startQuiz(qs){
  ex.phase='run'; ex.qs=qs; ex.i=0; ex.score=0; ex.res=[]; renderQuestion();
}
examzone.addEventListener('click', function(e){
  const opt = e.target.closest('[data-opt]');
  if(opt && !ex.checked){
    ex.sel = parseInt(opt.getAttribute('data-opt'),10);
    examzone.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-checked', b===opt);});
    document.getElementById('checkbtn').disabled = false; return;
  }
  const b = e.target.closest('[data-x]'); if(!b) return;
  const x = b.getAttribute('data-x');
  if(x==='start'){
    SETUP.theme = document.getElementById('xtheme').value; SETUP.count = document.getElementById('xcount').value;
    const types = [];
    examzone.querySelectorAll('#xtypes input').forEach(function(i){ SETUP.types[i.getAttribute('data-type')] = i.checked; if(i.checked) types.push(i.getAttribute('data-type')); });
    if(!types.length){ renderSetup('Choose at least one question type.'); return; }
    const qs = buildQuiz(parseInt(SETUP.theme,10), parseInt(SETUP.count,10), types);
    if(!qs.length){ renderSetup('This theme has no words for the chosen question types. Pick another theme or type.'); return; }
    startQuiz(qs);
  }
  else if(x==='check') doCheck();
  else if(x==='next') nextQ();
  else if(x==='sound'){ const q = ex.qs[ex.i]; if(q) speak(q.w.de,false); }
  else if(x==='slow'){ const q = ex.qs[ex.i]; if(q) speak(q.w.de,true); }
  else if(x==='retry'){
    const pool = WORDS;
    const qs = ex.res.filter(function(r){return !r.ok;}).map(function(r){return makeQuestion(r.q.type, r.q.w, WORDS.filter(function(w){return SETUP.theme==='-1' || String(w.t)===SETUP.theme;}));});
    startQuiz(shuffle(qs));
  }
  else if(x==='again'){ ex.phase='setup'; renderSetup(); }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(!panelExam.hidden){
    if(ex.phase!=='run') return;
    if(e.key==='Enter'){
      if(tag==='button' && e.target.id!=='checkbtn') return;
      e.preventDefault();
      const cb = document.getElementById('checkbtn'); if(cb && !cb.disabled) cb.click();
    } else if(!ex.checked && tag!=='input' && /^[1-4]$/.test(e.key)){
      const o = examzone.querySelectorAll('.opt')[parseInt(e.key,10)-1]; if(o) o.click();
    }
    return;
  }
  if(tag==='input' || tag==='select' || tag==='textarea') return;
  if(e.key==='ArrowRight'){ go(1); }
  else if(e.key==='ArrowLeft'){ go(-1); }
  else if(e.key===' ' && tag!=='button'){ e.preventDefault(); const c = document.getElementById('thecard'); if(c) c.click(); }
  else if(e.key==='s' || e.key==='S'){ const w = currentWord(); if(w) speak(w.de,false); }
});

/* ---------- start ---------- */
buildDeck();
renderSetup();
</script>

</body></html>
